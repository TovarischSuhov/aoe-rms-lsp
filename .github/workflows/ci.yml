name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt / test / lint / vuln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          test -z "$(goimports -l .)"

      - name: Check gofumpt formatting
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          test -z "$(golangci-lint fmt --diff .)"

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  vscode:
    name: vscode extension (.vsix)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile: the npm registry is unreachable from some dev
      # environments, so versions are pinned exactly in package.json
      # and the install cache is keyed by its hash.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: editors/vscode/node_modules
          key: vscode-nm-${{ hashFiles('editors/vscode/package.json') }}

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Package .vsix
        run: npx vsce package --no-dependencies

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: aoe2-lsp-vsix
          path: editors/vscode/*.vsix

  corpus:
    name: corpus gate (100 real maps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Selective: PRs skip the corpus (fetch costs a network round-trip);
    # the gate runs on master pushes, manual dispatch and could be
    # scheduled nightly if the pool ever needs drift-watching.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build server
        run: go build -o aoe2-lsp ./cmd/aoe2-lsp

      # The fetch sample is deterministic (pinned SHAs + stable ordering),
      # so the whole directory is cached by the sources hash — a cache hit
      # skips every network round-trip.
      - name: Cache corpus sample
        uses: actions/cache@v4
        with:
          path: .corpus
          key: corpus-${{ hashFiles('scripts/corpus-sources.txt') }}

      - name: Fetch corpus (skipped on cache hit)
        run: |
          if [ "$(find .corpus -type f 2>/dev/null | wc -l)" -ge 100 ]; then
            echo "corpus: sample cached ($(find .corpus -type f | wc -l) files)"
          else
            scripts/corpus-fetch.sh .corpus
          fi

      - name: Run corpus gate
        run: go run ./cmd/corpus -bin ./aoe2-lsp -dir .corpus

  coverage:
    name: coverage badge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Self-contained badge: shields.io renders the JSON endpoint pushed to
      # the orphan `badges` branch — no third-party coverage service. The
      # badge on PR runs is validated but not published.
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pct="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          num="${pct%\%}"
          color="$(jq -rn --argjson n "$num" \
            'if $n >= 80 then "brightgreen" elif $n >= 60 then "yellowgreen" elif $n >= 40 then "yellow" else "red" end')"

          dir="$RUNNER_TEMP/badge"
          rm -rf "$dir"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"
          cd "$dir"
          git switch --orphan badges

          jq -n --arg m "$pct" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: $m, color: $c}' > coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage: ${pct}"
          git push --force origin badges
