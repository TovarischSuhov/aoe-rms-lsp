name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt / test / lint / vuln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          test -z "$(goimports -l .)"

      - name: Check gofumpt formatting
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          test -z "$(golangci-lint fmt --diff .)"

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  coverage:
    name: coverage badge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Self-contained badge: shields.io renders the JSON endpoint pushed to
      # the orphan `badges` branch — no third-party coverage service. The
      # badge on PR runs is validated but not published.
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pct="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          num="${pct%\%}"
          color="$(jq -rn --argjson n "$num" \
            'if $n >= 80 then "brightgreen" elif $n >= 60 then "yellowgreen" elif $n >= 40 then "yellow" else "red" end')"

          dir="$RUNNER_TEMP/badge"
          rm -rf "$dir"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"
          cd "$dir"
          git switch --orphan badges

          jq -n --arg m "$pct" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: $m, color: $c}' > coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage: ${pct}"
          git push --force origin badges
