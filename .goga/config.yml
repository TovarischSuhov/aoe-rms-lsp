language: golang
image: qarium/goga-golang-1.26:1.3
build:
  task_executor:
    agent: claude
    env:
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: "off"
pipeline:
  agent: claude
  env:
    GOPROXY: https://goproxy.cn,direct
    GOSUMDB: "off"
codemanifest:
  usages:
    conventions: .goga/usages/conventions.md
  annotations: |
    Use `conventions` for code writing rules and testing.
